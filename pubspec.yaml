name: godelivery_lb_app
description: "GoDelivery-lb - Delivery Management Flutter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # API & HTTP
  http: ^1.1.0

  # State Management
  provider: ^6.0.0

  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # Date & Time
  intl: ^0.18.1

  # Navigation
  go_router: ^10.0.0

  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0

  # Form Validation
  form_validator: ^2.0.0

  # Loading & Dialog
  loading_animation_widget: ^1.2.0
  rflutter_alert: ^2.0.7

  # Connectivity
  connectivity_plus: ^5.0.0

  # Logging
  logger: ^2.0.1

  # PDF Export
  pdf: ^3.10.4
  printing: ^5.11.0

  # Map & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2

  # Phone/WhatsApp
  url_launcher: ^6.1.14

  # Image Handling
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

